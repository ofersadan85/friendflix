services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      args:
        - VITE_BACKEND_URL=${BACKEND_URL}:${BACKEND_PORT}
    ports:
      - ${FRONTEND_PORT}:80

  backend:
    container_name: backend
    build:
      context: ./backend
    environment:
      # - FRIENDFLIX_DEBUG=true
      # - FRIENDFLIX_FRONTEND_URL="http://localhost:5000"  # Will default to '*' for CORS if not supplied
      - FRIENDFLIX_DB_ADDRESS=postgres://${DB_USER:-postgres}:${DB_PASS:-password}@${DB_HOST:-localhost}:${DB_PORT:-5432}/${DB_NAME:-postgres}
    env_file:
      - .env
    ports:
      - ${BACKEND_PORT}:8080

  postgres:
    container_name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-postgres}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-password}
    ports:
      - ${DB_PORT:-5432}:5432
    volumes:
      - ./data:/var/lib/postgresql/data
